<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h1>Waste Request Details</h1>

    <div class="details-card">

        <p><strong>Request ID:</strong>
            <span id="requestId"></span>
        </p>

        <p><strong>Waste Type:</strong>
            <span id="wasteType"></span>
        </p>

        <p><strong>Quantity:</strong>
            <span id="quantity"></span>
        </p>

        <p><strong>Location:</strong>
            <span id="location"></span>
        </p>

        <p><strong>Status:</strong>
            <span id="status"></span>
        </p>

        <p><strong>Collector:</strong>
            <span id="collector"></span>
        </p>

        <p><strong>Date Created:</strong>
            <span id="createdAt"></span>
        </p>

        <p><strong>Date Completed:</strong>
            <span id="completedAt"></span>
        </p>

    </div>

</div>

<script type="module"
        src="js/request-details.js">
</script>

</body>
</html>
